<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05040a">
<title>SHIVAM BOT BUILDER • NEXUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --void:#05040a; --surface:rgba(16,14,32,.72); --glass:rgba(22,18,44,.55);
  --glass-2:rgba(30,24,58,.78);
  --border-soft:rgba(160,120,255,.14); --border-hard:rgba(160,120,255,.38);
  --aurora-teal:#2ff5c8; --aurora-violet:#9d7bff; --aurora-rose:#ff5fa8;
  --aurora-amber:#ffc25c; --aurora-blue:#4db8ff;
  --success:#3dffa5; --danger:#ff4d7a; --warn:#ffb84d;
  --text:#f8f6ff; --muted:#9c98c7; --dim:#615d94;
  --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--void);color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  font-feature-settings:"cv11","ss01";
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none;appearance:none;-webkit-appearance:none}
button{cursor:pointer}
a{color:var(--aurora-teal);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--aurora-violet);color:#fff}
code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;background:rgba(45,245,200,.08);padding:3px 8px;border-radius:6px;color:var(--aurora-teal);word-break:break-all;border:1px solid rgba(45,245,200,.16)}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(10,8,22,.4)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--aurora-teal),var(--aurora-violet),var(--aurora-rose));border-radius:8px;border:2px solid var(--void)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--aurora-amber),var(--aurora-rose))}

/* ─── COSMIC BACKGROUND ────────────────────────────────────── */
.cosmos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cosmos::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse 90% 60% at 15% 0%,rgba(157,123,255,.16),transparent 60%),
    radial-gradient(ellipse 80% 60% at 85% 100%,rgba(255,95,168,.14),transparent 60%),
    radial-gradient(ellipse 100% 70% at 50% 50%,rgba(45,245,200,.06),transparent 70%);
}
.aurora{
  position:absolute;left:-15%;right:-15%;height:70vh;top:-10%;
  background:conic-gradient(from 180deg at 50% 50%,
    rgba(45,245,200,.22),rgba(157,123,255,.22) 25%,rgba(255,95,168,.18) 50%,
    rgba(255,194,92,.18) 75%,rgba(45,245,200,.22) 100%);
  filter:blur(120px);opacity:.5;animation:auroraShift 24s ease-in-out infinite;border-radius:50%;
}
@keyframes auroraShift{
  0%,100%{transform:translateX(0) rotate(0) scale(1)}
  50%{transform:translateX(8%) rotate(8deg) scale(1.15)}
}
.stars{position:absolute;inset:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--dur,3s) ease-in-out infinite;animation-delay:var(--delay,0s)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.grid-mesh{
  position:absolute;inset:0;opacity:.35;
  background-image:
    linear-gradient(rgba(157,123,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(157,123,255,.07) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 10%,transparent 85%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 10%,transparent 85%);
}

/* ═══════════════════════════════════════════════════════════════
   LOGIN SCREEN — MEDIUM SIZE, KHATARNAK DESIGN
   ═══════════════════════════════════════════════════════════════ */
#loginScreen{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  padding:16px;overflow-y:auto;
  background:radial-gradient(circle at 50% 50%,rgba(10,8,22,.85),var(--void) 70%);
  backdrop-filter:blur(6px);
}
.login-wrap{
  position:relative;z-index:2;width:100%;max-width:400px;text-align:center;
  animation:loginIn .9s cubic-bezier(.22,1,.36,1);
}
@keyframes loginIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}

/* Logo Orb — Compact 130px */
.logo-orb{position:relative;width:130px;height:130px;margin:0 auto 18px}
.orb-ring{
  position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;
  animation:spin linear infinite;
}
.orb-ring.r1{border-top-color:var(--aurora-teal);border-right-color:var(--aurora-teal);box-shadow:0 0 30px rgba(45,245,200,.5);animation-duration:5s}
.orb-ring.r2{inset:16px;border-bottom-color:var(--aurora-rose);border-left-color:var(--aurora-rose);box-shadow:0 0 30px rgba(255,95,168,.45);animation-duration:7s;animation-direction:reverse}
.orb-ring.r3{inset:32px;border-top-color:var(--aurora-amber);border-right-color:var(--aurora-amber);box-shadow:0 0 30px rgba(255,194,92,.45);animation-duration:4s}
@keyframes spin{to{transform:rotate(360deg)}}
.orb-core{
  position:absolute;inset:44px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,rgba(157,123,255,.5),transparent 55%),
    radial-gradient(circle at 70% 75%,rgba(255,95,168,.4),transparent 55%),
    linear-gradient(135deg,#1a1740,#08060f);
  border:2px solid rgba(45,245,200,.55);
  display:grid;place-items:center;
  font-size:30px;font-weight:900;color:var(--aurora-teal);
  text-shadow:0 0 25px rgba(45,245,200,.9);
  box-shadow:inset 0 0 40px rgba(45,245,200,.3),0 0 60px rgba(45,245,200,.35);
  animation:orbPulse 3s ease-in-out infinite;letter-spacing:-1px;
}
@keyframes orbPulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.08);filter:brightness(1.25)}}
.orb-dot{position:absolute;width:9px;height:9px;border-radius:50%;top:50%;left:50%;margin:-4.5px}
.orb-dot.d1{background:var(--aurora-teal);box-shadow:0 0 16px var(--aurora-teal);animation:orbit1 7s linear infinite}
.orb-dot.d2{background:var(--aurora-rose);box-shadow:0 0 16px var(--aurora-rose);animation:orbit2 9s linear infinite}
.orb-dot.d3{background:var(--aurora-amber);box-shadow:0 0 16px var(--aurora-amber);animation:orbit3 5.5s linear infinite}
@keyframes orbit1{from{transform:rotate(0) translateX(65px) rotate(0)}to{transform:rotate(360deg) translateX(65px) rotate(-360deg)}}
@keyframes orbit2{from{transform:rotate(120deg) translateX(51px) rotate(-120deg)}to{transform:rotate(480deg) translateX(51px) rotate(-480deg)}}
@keyframes orbit3{from{transform:rotate(240deg) translateX(37px) rotate(-240deg)}to{transform:rotate(600deg) translateX(37px) rotate(-600deg)}}

/* Brand */
.brand-h1{
  font-size:24px;font-weight:900;letter-spacing:-.3px;line-height:1.15;margin-bottom:6px;
  background:linear-gradient(95deg,var(--aurora-teal),var(--aurora-violet) 35%,var(--aurora-rose) 70%,var(--aurora-amber));
  background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:titleShift 5s ease infinite;
  filter:drop-shadow(0 0 30px rgba(157,123,255,.35));
}
@keyframes titleShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.brand-h2{font-size:9.5px;color:var(--muted);letter-spacing:6px;font-weight:800;text-transform:uppercase;margin-bottom:24px}

/* Login Card — Medium width, compact padding */
.login-card{
  position:relative;padding:26px 24px;border-radius:var(--radius-lg);
  background:linear-gradient(160deg,rgba(22,18,44,.94),rgba(10,8,22,.98));
  border:1px solid var(--border-hard);
  box-shadow:0 25px 70px rgba(0,0,0,.65),0 0 60px rgba(157,123,255,.18),inset 0 1px rgba(255,255,255,.06);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  animation:cardBreath 7s ease-in-out infinite;overflow:hidden;
}
.login-card::before{
  content:"";position:absolute;inset:-2px;border-radius:calc(var(--radius-lg) + 2px);
  padding:2px;
  background:conic-gradient(from 0deg,var(--aurora-teal),var(--aurora-violet),var(--aurora-rose),var(--aurora-amber),var(--aurora-teal));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.6;animation:spin 6s linear infinite;pointer-events:none;
}
@keyframes cardBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.mode-tabs{display:flex;background:rgba(0,0,0,.5);border:1px solid var(--border-soft);border-radius:12px;padding:4px;margin-bottom:16px}
.mode-tabs button{flex:1;padding:10px;border-radius:9px;font-weight:800;font-size:12px;color:var(--muted);transition:.35s;letter-spacing:.3px}
.mode-tabs button.on{
  background:linear-gradient(135deg,var(--aurora-teal),var(--aurora-violet));
  color:#0a0816;box-shadow:0 8px 24px rgba(45,245,200,.4),inset 0 1px rgba(255,255,255,.3);
}

.key-box{
  width:100%;padding:15px 16px;background:rgba(0,0,0,.55);
  border:1.5px solid var(--border-soft);border-radius:12px;
  font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:1.5px;color:#fff;
  transition:.35s;margin-bottom:14px;
}
.key-box:focus{
  border-color:var(--aurora-teal);background:rgba(0,0,0,.7);
  box-shadow:0 0 0 4px rgba(45,245,200,.1),0 0 35px rgba(45,245,200,.15);
}
.key-box::placeholder{color:var(--dim);letter-spacing:0;font-family:'Inter',sans-serif}

.enter-btn{
  width:100%;padding:15px;border-radius:12px;
  font-weight:900;font-size:13.5px;letter-spacing:1px;
  background:linear-gradient(120deg,var(--aurora-teal),var(--aurora-violet) 50%,var(--aurora-rose));
  background-size:220% 100%;color:#0a0816;
  box-shadow:0 12px 35px rgba(45,245,200,.35),inset 0 1px rgba(255,255,255,.4);
  transition:.35s;animation:titleShift 4s ease infinite;
  position:relative;overflow:hidden;
}
.enter-btn::after{
  content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transition:.7s;
}
.enter-btn:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 18px 50px rgba(45,245,200,.5)}
.enter-btn:hover::after{left:120%}
.enter-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

.login-foot{margin-top:16px;font-size:10.5px;color:var(--dim);letter-spacing:.4px;text-align:center}
.pulse-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 12px var(--success);margin-right:6px;animation:pulseDot 1.7s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}

/* ═══════════════════════════════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════════════════════════════ */
#app{display:none;position:relative;z-index:1;min-height:100vh}
#app.on{display:block}

.topbar{
  position:sticky;top:0;z-index:60;height:68px;padding:0 20px;
  display:flex;align-items:center;gap:14px;
  background:rgba(5,4,10,.72);
  backdrop-filter:blur(32px) saturate(160%);
  -webkit-backdrop-filter:blur(32px) saturate(160%);
  border-bottom:1px solid var(--border-soft);
}
.menu-btn{
  width:44px;height:44px;flex-shrink:0;border-radius:12px;
  display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(145deg,rgba(157,123,255,.14),rgba(45,245,200,.06));
  border:1px solid var(--border-soft);color:var(--text);transition:.35s;
}
.menu-btn:hover{border-color:var(--aurora-teal);color:var(--aurora-teal);box-shadow:0 0 25px rgba(45,245,200,.35);transform:translateY(-1px)}
.menu-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}

.brand-chip{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.brand-chip .line1{
  font-size:14px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(90deg,var(--aurora-teal),var(--aurora-violet),var(--aurora-rose));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:titleShift 6s ease infinite;
}
.brand-chip .line2{font-size:9px;color:var(--dim);letter-spacing:3px;font-weight:800}

.topbar-right{display:flex;align-items:center;gap:10px}
.bell-btn{
  width:42px;height:42px;border-radius:11px;position:relative;
  display:grid;place-items:center;background:rgba(255,255,255,.04);
  border:1px solid var(--border-soft);color:var(--muted);transition:.3s;
}
.bell-btn:hover{color:var(--aurora-amber);border-color:var(--aurora-amber);box-shadow:0 0 20px rgba(255,194,92,.3)}
.bell-btn .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 10px var(--danger);border:2px solid var(--void)}
.bot-picker{
  background:rgba(22,18,44,.85);border:1px solid var(--border-hard);
  border-radius:11px;padding:9px 12px;color:#fff;font-size:11.5px;font-weight:700;
  max-width:170px;cursor:pointer;transition:.3s;
}
.bot-picker:hover{border-color:var(--aurora-teal);box-shadow:0 0 20px rgba(45,245,200,.15)}
.avatar{
  width:44px;height:44px;border-radius:50%;position:relative;
  display:grid;place-items:center;font-weight:900;font-size:15px;color:#0a0816;
  background:conic-gradient(from 200deg,var(--aurora-teal),var(--aurora-violet),var(--aurora-rose),var(--aurora-amber),var(--aurora-teal));
  box-shadow:0 0 25px rgba(157,123,255,.55),inset 0 1px rgba(255,255,255,.35);
  transition:.4s;border:2px solid rgba(255,255,255,.2);
}
.avatar:hover{transform:scale(1.1) rotate(10deg);box-shadow:0 0 45px rgba(157,123,255,.8)}

.scrim{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.35s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:320px;max-width:88vw;z-index:100;
  background:linear-gradient(170deg,rgba(15,12,30,.99),rgba(8,6,18,.99));
  border-right:1px solid var(--border-hard);
  transform:translateX(-102%);transition:transform .45s cubic-bezier(.22,1,.36,1);
  overflow-y:auto;box-shadow:50px 0 130px rgba(0,0,0,.8),0 0 100px rgba(157,123,255,.12);
}
.drawer.on{transform:translateX(0)}
.drawer-top{padding:22px 20px 18px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:rgba(15,12,30,.98);z-index:5;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;gap:12px}
.drawer-top .name{font-size:16px;font-weight:900;letter-spacing:.4px}
.drawer-top .name span{background:linear-gradient(90deg,var(--aurora-teal),var(--aurora-rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.drawer-top .sub{font-size:9px;color:var(--dim);letter-spacing:3px;margin-top:5px;font-weight:800}
.drawer-close{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border-soft);display:grid;place-items:center;color:var(--text);font-size:15px;transition:.3s}
.drawer-close:hover{background:rgba(255,77,122,.16);border-color:var(--danger);color:var(--danger);transform:rotate(90deg)}
.drawer-nav{padding:16px 12px 40px}
.nav-sect{margin-bottom:18px}
.nav-sect-lbl{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:3px;padding:0 10px 8px;font-weight:900;display:flex;align-items:center;gap:10px}
.nav-sect-lbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border-soft),transparent)}
.nav-btn{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 13px;border-radius:11px;color:var(--muted);font-size:13px;font-weight:700;
  transition:.3s;margin-bottom:3px;border:1px solid transparent;text-align:left;position:relative;overflow:hidden;
}
.nav-btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--aurora-teal),var(--aurora-rose));transform:scaleY(0);transition:.3s}
.nav-btn:hover{background:linear-gradient(100deg,rgba(45,245,200,.08),rgba(157,123,255,.05));color:#fff;border-color:rgba(45,245,200,.2);transform:translateX(4px)}
.nav-btn:hover::before{transform:scaleY(1)}
.nav-btn.on{background:linear-gradient(100deg,rgba(45,245,200,.16),rgba(157,123,255,.08),transparent);color:var(--aurora-teal);border-color:rgba(45,245,200,.3);box-shadow:inset 3px 0 0 var(--aurora-teal)}
.nav-btn.on::before{transform:scaleY(1)}
.nav-ico{width:24px;height:24px;flex-shrink:0;display:grid;place-items:center;font-size:16px}
.nav-btn.on .nav-ico{filter:drop-shadow(0 0 10px rgba(45,245,200,.7))}

.main{padding:22px 20px 90px;max-width:1600px;margin:0 auto}
.head{animation:headIn .55s cubic-bezier(.22,1,.36,1);margin-bottom:22px}
.head .kicker{font-size:10px;color:var(--aurora-teal);letter-spacing:4px;font-weight:800;text-transform:uppercase;margin-bottom:6px}
.head h1{
  font-size:28px;font-weight:900;letter-spacing:-.8px;line-height:1.15;
  background:linear-gradient(90deg,#fff,var(--aurora-teal) 45%,var(--aurora-violet));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:titleShift 6s ease infinite;
}
.head p{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.6}
.view{animation:viewIn .5s cubic-bezier(.22,1,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes headIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.glass{
  background:linear-gradient(155deg,rgba(30,24,58,.62),rgba(14,11,28,.86));
  border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:22px;
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  position:relative;overflow:hidden;transition:.4s cubic-bezier(.22,1,.36,1);
}
.glass::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(45,245,200,.7),rgba(157,123,255,.7),transparent);opacity:0;transition:.4s}
.glass:hover{border-color:var(--border-hard);transform:translateY(-4px);box-shadow:0 26px 60px rgba(0,0,0,.5),0 0 60px rgba(157,123,255,.14)}
.glass:hover::before{opacity:1}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}

.hero{
  position:relative;overflow:hidden;padding:28px;border-radius:calc(var(--radius-lg) + 4px);margin-bottom:20px;
  background:
    radial-gradient(circle at 20% 20%,rgba(45,245,200,.16),transparent 50%),
    radial-gradient(circle at 80% 70%,rgba(255,95,168,.16),transparent 50%),
    linear-gradient(140deg,rgba(22,18,44,.9),rgba(10,8,22,.96));
  border:1px solid var(--border-hard);
  box-shadow:0 26px 70px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.06);
}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 90% 15%,rgba(45,245,200,.14),transparent 60%),radial-gradient(ellipse 50% 30% at 10% 90%,rgba(255,194,92,.12),transparent 60%)}
.hero-inner{position:relative;display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hero-copy{flex:1;min-width:260px}
.hero-copy .kicker{font-size:10px;color:var(--aurora-teal);letter-spacing:4px;font-weight:800;text-transform:uppercase;margin-bottom:8px}
.hero-copy h2{font-size:24px;font-weight:900;letter-spacing:-.7px;line-height:1.15;margin-bottom:10px;background:linear-gradient(90deg,#fff,var(--aurora-teal) 45%,var(--aurora-rose));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleShift 5s ease infinite}
.hero-copy p{color:var(--muted);font-size:13px;line-height:1.65;max-width:560px}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

<body>

<div class="cosmos">

</div>

<!-- LOGIN SCREEN -->

      <button class="enter-btn" id="loginBtn" onclick="doLogin()">⚡ ENTER NEXUS</button>

<!-- APP -->
<div id="app">
  <header class="topbar">

  <span class="ti" id="toastIcon">✅</span>
  <span id="toastText"></span>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   COSMIC BG
   ═══════════════════════════════════════════════════════════ */
(function initStars(){
  const s=document.getElementById('stars');
  for(let i=0;i<100;i++){
    const st=document.createElement('div');st.className='star';
    const sz=Math.random()*2+.4;
    st.style.width=st.style.height=sz+'px';
    st.style.left=Math.random()*100+'%';
    st.style.top=Math.random()*100+'%';
    st.style.setProperty('--dur',(2+Math.random()*4)+'s');
    st.style.setProperty('--delay',(Math.random()*5)+'s');
    st.style.opacity=.2+Math.random()*.8;
    if(Math.random()>.7){st.style.background='#2ff5c8';st.style.boxShadow='0 0 8px #2ff5c8'}
    else if(Math.random()>.6){st.style.background='#ff5fa8';st.style.boxShadow='0 0 8px #ff5fa8'}
    s.appendChild(st);
  }
})();

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
let csrf='', me=null, bots=[], botId=null, page='dashboard', authMode='user';
const $=(s)=>document.querySelector(s);
const $$=(s)=>document.querySelectorAll(s);

function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(d){try{return new Date(d).toLocaleString()}catch{return d||'—'}}
function money(x){return '₹'+Number(x||0).toFixed(2)}
function toast(msg,type='ok'){
  const t=$('#toast');
  t.className='toast on '+type;
  $('#toastIcon').textContent=type==='err'?'❌':'✅';
  $('#toastText').textContent=msg;
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3500);
}
function openNav(){$('#drawer').classList.add('on');$('#scrim').classList.add('on')}
function closeNav(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on')}
function showModal(html){$('#modalInner').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
function copyTxt(t){navigator.clipboard.writeText(t).then(()=>toast('Copied!')).catch(()=>toast('Copy failed','err'))}
function toggleNotify(){$('#notifyPop').classList.toggle('on')}

/* ═══════════════════════════════════════════════════════════
   API
   ═══════════════════════════════════════════════════════════ */
async function api(url,opts={}){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),20000);
  try{
    const headers={'Content-Type':'application/json',...(opts.headers||{})};
    if(csrf) headers['X-CSRF-Token']=csrf;
    const res=await fetch(url,{...opts,signal:ctrl.signal,headers});
    clearTimeout(t);
    let data={};try{data=await res.json()}catch{}
    if(!res.ok||(data&&data.ok===false)){
      if(res.status===401){logout(false);throw new Error('Session expired')}
      throw new Error(data.message||`Request failed (${res.status})`);
    }
    return data;
  }catch(e){
    clearTimeout(t);
    if(e.name==='AbortError') throw new Error('Request timed out');
    throw e;
  }
}

/* ═══════════════════════════════════════════════════════════
   AUTH
   ═══════════════════════════════════════════════════════════ */
document.querySelectorAll('#modeTabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#modeTabs button').forEach(x=>x.classList.remove('on'));

function buildCmdk(q=''){
  const ql=q.toLowerCase().trim();
  const isAdmin=me?.role==='admin';
  const items=[];
  NAV.forEach(g=>{
    if(g.adminOnly&&!isAdmin) return;
    g.items.forEach(it=>items.push({ico:it.ico,lbl:it.lbl,act:()=>go(it.id),group:g.t}));
  });
  bots.forEach(b=>items.push({ico:'🤖',lbl:b.name,act:()=>{botId=b.id;switchBot(b.id)},group:'BOTS'}));
  const filtered=ql?items.filter(i=>i.lbl.toLowerCase().includes(ql)||i.group.toLowerCase().includes(ql)):items.slice(0,12);
  $('#cmdkList').innerHTML=filtered.length?filtered.map((it,i)=>
    `<div class="cmdk-item ${i===0?'hi':''}" onclick='closeCmdk();(${it.act.toString()})()'>
      <span class="ci">${it.ico}</span><span>${esc(it.lbl)}</span>
      <span class="ck">${it.group}</span></div>`
  ).join(''):'<div class="cmdk-item" style="justify-content:center;color:var(--dim)">No results</div>';
}
function openCmdk(){buildCmdk();$('#cmdk').classList.add('on');setTimeout(()=>$('#cmdkInput').focus(),50)}
function closeCmdk(){$('#cmdk').classList.remove('on');$('#cmdkInput').value=''}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeNav();closeCmdk();$('#notifyPop')?.classList.remove('on')}
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openCmdk()}
});
document.addEventListener('input',e=>{if(e.target.id==='cmdkInput')buildCmdk(e.target.value)});

function previewMedia(url){
  const box=$('#mediaPreviewBox');
  if(!url || !url.trim()){box.innerHTML='';return}
  const u=url.toLowerCase().split('?')[0];
  let type='text', ico='📄', name='Link';
  if(/\.(jpg|jpeg|png|gif|webp)$/.test(u)){type='photo';ico='🖼️';name='Photo'}
  else if(/\.(mp4|mov|mkv|webm|avi)$/.test(u)){type='video';ico='🎬';name='Video'}
  else if(/\.(mp3|m4a|ogg|wav|opus)$/.test(u)){type='audio';ico='🎵';name='Audio'}
  else if(/\.(pdf|zip|apk|doc|docx)$/.test(u)){type='document';ico='📄';name='Document'}
  box.innerHTML=`<div class="media-preview">
    <div class="ico">${ico}</div>
    <div class="info"><b>Detected: ${name}</b><span>${esc(url.slice(0,80))}</span></div>
  </div>`;
}
async function sendBroadcast(){
  const text=$('#bcText').value.trim();
  if(!text) return toast('Enter a message','err');
  try{
    await api(`/api/broadcast/${botId}`,{method:'POST',body:JSON.stringify({
      text,
      media_url:$('#bcMedia').value.trim(),
      media_type:''
    })});
    toast('Broadcast queued!');$('#bcText').value='';$('#bcMedia').value='';$('#mediaPreviewBox').innerHTML='';
    pgBroadcast();
  }catch(e){toast(e.message,'err')}
}

  let s={api_url:'',api_key:'',master_key:''};

  $('#view').innerHTML=`
    <div class="head"><div class="kicker">⚙️ INTEGRATION</div><h1>Key Delivery API</h1><p>Connect an external reseller API for auto-key delivery.</p></div>
    <div class="glass" style="max-width:620px;padding:26px">
      <div class="field"><label class="label">API URL</label><input class="input" id="apiUrl" value="${esc(s.api_url||'')}" placeholder="https://example.com/api/reseller.php"></div>
      <div class="field"><label class="label">API Key</label><input class="input" id="apiKey" type="password" value="${esc(s.api_key||'')}" placeholder="Your API Key"></div>
      <div class="field"><label class="label">Master Key (optional)</label><input class="input" id="masterKey" type="password" value="${esc(s.master_key||'')}" placeholder="Optional"></div>
      <div class="flex">
        <button class="btn primary" onclick="saveApiSetup()">💾 SAVE</button>
        <button class="btn" onclick="testApiSetup()">🔌 TEST</button>
      </div>
      <div id="apiRes" class="mt-2 sm"></div>
    </div>`;
}
async function saveApiSetup(){
  try{
    await api(`/api/bot/${botId}/api-settings`,{method:'PUT',body:JSON.stringify({
      api_url:$('#apiUrl').value.trim(),api_key:$('#apiKey').value.trim(),master_key:$('#masterKey').value.trim()
    })});
    toast('API settings saved!');
  }catch(e){toast(e.message,'err')}
}
async function testApiSetup(){
  const r=$('#apiRes');r.innerHTML='<span class="muted">🔄 Testing...</span>';
  try{
    const d=await api(`/api/bot/${botId}/api-test`,{method:'POST'});
    r.innerHTML=`<span style="color:var(--success)">✅ ${esc(d.message||'Connected!')}</span>`;
  }catch(e){r.innerHTML=`<span style="color:var(--danger)">❌ ${esc(e.message)}</span>`}
}

/* ═══════════════════════════════════════════════════════════
   PAGE: SETTINGS
   ═══════════════════════════════════════════════════════════ */

  try{const d=await api(`/api/config/${botId}`);(d.settings||[]).forEach(s=>{c[s.key]=s.value})}catch{}
  const F=(k,d='')=>c[k]||d;
  $('#view').innerHTML=`
    <div class="head"><div class="kicker">⚡ CONFIG</div><h1>Store Settings</h1><p>Branding, deposits, referrals, spin — everything in one place.</p></div>
    <div class="glass mb-3">
      <h3 style="font-size:14px;font-weight:900;margin-bottom:16px">🎨 BRANDING</h3>
      <div class="field-row">
        <div class="field"><label class="label">Shop Name</label><input class="input" id="s_store_name" value="${esc(F('store_name','SHIVAM STORE'))}"></div>
        <div class="field"><label class="label">Tagline</label><input class="input" id="s_store_tagline" value="${esc(F('store_tagline',''))}"></div>
      </div>
      <div class="field"><label class="label">Announcement</label><textarea class="ta" id="s_store_announcement" rows="2">${esc(F('store_announcement',''))}</textarea></div>
    </div>
    <div class="glass mb-3">
      <h3 style="font-size:14px;font-weight:900;margin-bottom:16px">🔗 LINKS</h3>
      <div class="field-row">
        <div class="field"><label class="label">How to Use</label><input class="input" id="s_link_how_to_use" value="${esc(F('link_how_to_use',''))}" placeholder="https://t.me/tutorial"></div>
        <div class="field"><label class="label">Download Files</label><input class="input" id="s_link_download_files" value="${esc(F('link_download_files',''))}" placeholder="https://t.me/files"></div>
      </div>
      <div class="field-row">
        <div class="field"><label class="label">Support</label><input class="input" id="s_link_support" value="${esc(F('link_support',''))}" placeholder="https://t.me/support"></div>
        <div class="field"><label class="label">Payment Proofs</label><input class="input" id="s_link_payment_proofs" value="${esc(F('link_payment_proofs',''))}" placeholder="https://t.me/proofs"></div>
      </div>
    </div>
    <div class="glass mb-3">
      <h3 style="font-size:14px;font-weight:900;margin-bottom:16px">💰 DEPOSITS & REFERRAL</h3>
      <div class="field-row">
        <div class="field"><label class="label">Min Deposit ₹</label><input class="input" id="s_min_deposit" type="number" value="${esc(F('min_deposit','10'))}"></div>
        <div class="field"><label class="label">Max Deposit ₹</label><input class="input" id="s_max_deposit" type="number" value="${esc(F('max_deposit','50000'))}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label class="label">Referral Reward (Balance ₹)</label><input class="input" id="s_referral_reward_balance" type="number" value="${esc(F('referral_reward_balance','2'))}"></div>
        <div class="field"><label class="label">Referral Reward (Purchase ₹)</label><input class="input" id="s_referral_reward_purchase" type="number" value="${esc(F('referral_reward_purchase','2'))}"></div>
      </div>

    <div class="glass mb-3">
      <h3 style="font-size:14px;font-weight:900;margin-bottom:16px">🎰 DAILY SPIN</h3>
      <div class="field-row">
        <div class="field"><label class="label">Spin Min ₹</label><input class="input" id="s_spin_min" type="number" step="0.01" value="${esc(F('spin_min','0.30'))}"></div>
        <div class="field"><label class="label">Spin Max ₹</label><input class="input" id="s_spin_max" type="number" step="0.01" value="${esc(F('spin_max','2.00'))}"></div>

        <div class="field"><label class="label">Cooldown (hours)</label><input class="input" id="s_spin_cooldown" type="number" value="${esc(F('spin_cooldown','24'))}"></div>

        <div class="field"><label class="label">Bronze</label><input class="input" id="s_milestone_bronze" type="number" value="${esc(F('milestone_bronze','10'))}"></div>

async function saveSettings(){
  const keys=['store_name','store_tagline','store_announcement','link_how_to_use','link_download_files','link_support','link_payment_proofs','min_deposit','max_deposit','referral_reward_balance','referral_reward_purchase','spin_min','spin_max','spin_cooldown','low_stock_threshold','milestone_bronze','milestone_silver','milestone_gold','milestone_diamond'];
  const body={};
  keys.forEach(k=>{const el=$('#s_'+k);if(el) body[k]=el.value});
  try{await api(`/api/config/${botId}`,{method:'PUT',body:JSON.stringify(body)});toast('Settings saved!')}catch(e){toast(e.message,'err')}
}

/* ═══════════════════════════════════════════════════════════
   PAGE: PROFILE
   ═══════════════════════════════════════════════════════════ */
async function pgProfile(){
  $('#view').innerHTML=`
    <div class="head"><div class="kicker">👤 ACCOUNT</div><h1>My Profile</h1><p>Your account information.</p></div>
    <div class="glass" style="max-width:500px;padding:30px;text-align:center">
      <div class="avatar" style="width:90px;height:90px;font-size:36px;margin:0 auto 18px">${(me?.username||'U')[0].toUpperCase()}</div>
      <h2 style="font-size:24px;font-weight:900;margin-bottom:8px">${esc(me?.username||'User')}</h2>
      <div class="badge">${esc(me?.role||'user').toUpperCase()}</div>

}

/* ═══════════════════════════════════════════════════════════
   PAGE: ADMIN KEYS
   ═══════════════════════════════════════════════════════════ */
async function pgAdminKeys(){
  if(me?.role!=='admin'){
    $('#view').innerHTML=`<div class="glass" style="padding:28px"><h3 style="color:var(--danger)">⛔ Admin only</h3></div>`;
    return;
  }
  const d=await api('/api/admin/keys');
  const ks=d.keys||[];
  $('#view').innerHTML=`
    <div class="head"><div class="kicker">🛡️ ADMIN</div><h1>Manage Keys</h1><p>Create access keys for sellers.</p></div>
    <div class="flex between mb-2">
      <span class="muted sm">${ks.length} key${ks.length!==1?'s':''}</span>
      <button class="btn primary" onclick="createKeyModal()">＋ Create User Key</button>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Device</th><th>Last Used</th><th>Actions</th></tr></thead>
      <tbody>${ks.length?ks.map(k=>`
        <tr><td><b>${esc(k.username||'—')}</b></td>
        <td><span class="pill info">${esc(k.role||'user')}</span></td>
        <td><span class="pill ${k.active?'ok':'off'}">${k.active?'ACTIVE':'OFF'}</span></td>
        <td>${k.device_fingerprint?'<span class="pill info">🔒 LOCKED</span>':'<span class="pill pend">UNLOCKED</span>'}</td>
        <td class="muted sm">${fmt(k.last_used_at||k.created_at)}</td>
        <td><button class="btn xs" onclick="toggleKeyStatus(${k.id},${k.active?0:1})">${k.active?'🚫':'✅'}</button>
        <button class="btn xs danger" onclick="delKey(${k.id})">🗑️</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty-cell">No keys</td></tr>`}</tbody>
    </table></div>`;
}
function createKeyModal(){
  showModal(`
    <div class="modal-top"><h3>🛡️ Create User Key</h3><button class="x-btn" onclick="closeModal()">✕</button></div>
    <div class="field"><label class="label">Username</label><input class="input" id="ckUser" placeholder="seller_name"></div>
    <div class="field"><label class="label">Bot Quota (max bots)</label><input class="input" id="ckQuota" type="number" value="2"></div>
    <div class="field"><label class="label">Custom Key (optional)</label><input class="input" id="ckKey" placeholder="Leave blank to auto-generate"></div>
    <p class="muted sm">The key is device-locked to the first device that uses it.</p>
    <div class="flex between mt-2" style="margin-top:18px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="createKey()">🔑 CREATE</button>
    </div>`);
}
async function createKey(){
  const username=$('#ckUser').value.trim(),key=$('#ckKey').value.trim(),quota=parseInt($('#ckQuota').value)||2;
  if(!username&&!key) return toast('Enter username or key','err');
  try{
    const d=await api('/api/admin/keys',{method:'POST',body:JSON.stringify({username,key,botQuota:quota})});
    toast('Key created!');
    showModal(`
      <div class="modal-top"><h3>✅ Key Created</h3><button class="x-btn" onclick="closeModal()">✕</button></div>
      <p class="muted mb-2">Share this key. It's device-locked on first use.</p>
      <div class="glass" style="background:rgba(0,0,0,.5);text-align:center;padding:22px">
        <code style="font-size:15px;letter-spacing:1px">${esc(d.key)}</code>
      </div>
      <button class="btn primary w-full mt-2" onclick="copyTxt('${esc(d.key)}')">📋 COPY KEY</button>
      <button class="btn w-full mt-2" onclick="closeModal();pgAdminKeys()">DONE</button>`);
  }catch(e){toast(e.message,'err')}
}
async function toggleKeyStatus(id,active){
  try{await api(`/api/admin/keys/${id}/status`,{method:'PUT',body:JSON.stringify({active})});toast('Updated');pgAdminKeys()}catch(e){toast(e.message,'err')}
}
async function delKey(id){
  if(!confirm('Delete this key?')) return;
  try{await api(`/api/admin/keys/${id}`,{method:'DELETE'});toast('Deleted');pgAdminKeys()}catch(e){toast(e.message,'err')}
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
(async function init(){
  try{
    const res=await fetch('/api/auth/me');
    if(res.ok){
      const data=await res.json();
      if(data.ok&&data.user){
        csrf=data.csrf||'';me=data.user;
        showApp();await loadBots();
        const h=location.hash.slice(1);
        go(PAGES[h]?h:'dashboard');
        return;
      }
    }
  }catch{}
  $('#loginScreen').style.display='flex';
})();
</script>
</body>
